<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Analyze New Resume - HireLens</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Noto+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#4d8bff",
                        "background-light": "#f5f6f8",
                        "background-dark": "#0f1623",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"],
                        "body": ["Noto Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                    backgroundImage: {
                        'grid-pattern': "linear-gradient(to right, #1f2937 1px, transparent 1px), linear-gradient(to bottom, #1f2937 1px, transparent 1px)",
                    }
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar for textarea */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: #172236; 
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb {
            background: #2e436b; 
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb:hover {
            background: #4d8bff; 
        }
        
        .glass-panel {
            background: rgba(15, 22, 35, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(77, 139, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .neon-border-dashed {
            background-image: url("data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='none' rx='12' ry='12' stroke='%234D8BFF' stroke-width='2' stroke-dasharray='12%2c 12' stroke-dashoffset='0' stroke-linecap='square'/%3e%3c/svg%3e");
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col font-display text-slate-900 dark:text-slate-100 overflow-x-hidden">
<!-- Subtle Grid Background -->
<div class="fixed inset-0 z-0 opacity-[0.07] pointer-events-none" style="background-size: 40px 40px; background-image: linear-gradient(to right, #4d8bff 1px, transparent 1px), linear-gradient(to bottom, #4d8bff 1px, transparent 1px);"></div>
<!-- Main Container -->
<div class="relative z-10 flex flex-col h-full grow">
<!-- Header -->
<header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-[#0f1624]/80 backdrop-blur-md px-6 lg:px-10 py-4 sticky top-0 z-50">
<div class="flex items-center gap-3 text-slate-900 dark:text-white">
<div class="flex items-center justify-center size-8 rounded bg-primary/20 text-primary">
<span class="material-symbols-outlined text-2xl">grid_view</span>
</div>
<h2 class="text-lg font-bold leading-tight tracking-[-0.015em]">HireLens</h2>
</div>
<nav class="hidden md:flex flex-1 justify-center gap-8">
<a class="text-slate-600 dark:text-slate-400 hover:text-primary dark:hover:text-primary transition-colors text-sm font-medium leading-normal" href="#">Dashboard</a>
<a class="text-slate-600 dark:text-slate-400 hover:text-primary dark:hover:text-primary transition-colors text-sm font-medium leading-normal" href="#">History</a>
<a class="text-slate-600 dark:text-slate-400 hover:text-primary dark:hover:text-primary transition-colors text-sm font-medium leading-normal" href="#">Settings</a>
</nav>
<div class="flex items-center gap-4">
<div class="hidden sm:flex items-center gap-3">
<span class="material-symbols-outlined text-slate-400 cursor-pointer hover:text-white transition-colors">notifications</span>
<div class="size-8 rounded-full bg-slate-700 overflow-hidden border border-slate-600">
<img alt="User Profile" class="w-full h-full object-cover" data-alt="User avatar profile picture" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDXm9SX6cF4YjfxZR6nLUazCujoKS0Jx2G19MYCm6n_y_CMdwxXNziE1AytFcvIP-sjYN_XRlfD3lA_FjlijOwhcHb3V29AFTiySYMOX6zeqd5CaoVDk9IZa8ulZ0H5K92dV3fw3sP62BetLWvHrGPbFvoGHnnoYf2d70mvpx9oUd3L_skpkIet3yEOi3RZFbnSfEa4ngf0nWt7bfwGnteyE9dywKH297rwmkmip6nnlJD0eT0aQt9kmvUa-hcZBuhYfGzx0qAQTm4"/>
</div>
</div>
<button class="flex items-center justify-center overflow-hidden rounded-lg h-9 px-4 bg-primary/10 hover:bg-primary/20 text-primary border border-primary/20 transition-all text-sm font-bold leading-normal tracking-[0.015em]">
<span class="truncate">Sign Out</span>
</button>
</div>
</header>
<!-- Content Area -->
<main class="flex-1 flex justify-center py-8 lg:py-12 px-4 sm:px-6">
<div class="flex flex-col max-w-[800px] w-full gap-8">
<!-- Page Title Section -->
<div class="text-center space-y-2">
<div class="inline-flex items-center justify-center px-3 py-1 rounded-full bg-primary/10 border border-primary/20 text-primary text-xs font-semibold tracking-wide uppercase mb-2">
<span class="w-2 h-2 rounded-full bg-primary mr-2 animate-pulse"></span>
                        AI Powered Analysis
                    </div>
<h1 class="text-3xl md:text-4xl font-bold tracking-tight text-slate-900 dark:text-white">
                        Analyze New <span class="text-transparent bg-clip-text bg-gradient-to-r from-primary to-blue-400">Candidate</span>
</h1>
<p class="text-slate-500 dark:text-slate-400 max-w-lg mx-auto">
                        Upload a resume and let our AI engine extract insights, skills, and compatibility scores in seconds.
                    </p>
</div>
<!-- Main Glass Card Form -->
<div class="glass-panel rounded-xl p-6 md:p-8 space-y-8 relative overflow-hidden">
<!-- Decorative glow behind card -->
<div class="absolute -top-24 -right-24 w-64 h-64 bg-primary/20 rounded-full blur-[80px] pointer-events-none"></div>
<div class="absolute -bottom-24 -left-24 w-64 h-64 bg-blue-600/10 rounded-full blur-[80px] pointer-events-none"></div>
<!-- Job Details Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6 relative z-10">
<label class="flex flex-col gap-2 group">
<span class="text-slate-300 text-sm font-medium flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-[18px]">business</span>
                                Company Name
                            </span>
<input class="form-input w-full rounded-lg bg-[#172236]/50 border border-slate-700/50 text-slate-100 placeholder:text-slate-500 focus:border-primary focus:ring-1 focus:ring-primary focus:bg-[#172236] transition-all duration-300 h-12 px-4" placeholder="e.g. CyberDyne Systems" type="text"/>
</label>
<label class="flex flex-col gap-2 group">
<span class="text-slate-300 text-sm font-medium flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-[18px]">badge</span>
                                Job Title
                            </span>
<input class="form-input w-full rounded-lg bg-[#172236]/50 border border-slate-700/50 text-slate-100 placeholder:text-slate-500 focus:border-primary focus:ring-1 focus:ring-primary focus:bg-[#172236] transition-all duration-300 h-12 px-4" placeholder="e.g. Senior Neural Engineer" type="text"/>
</label>
<label class="flex flex-col gap-2 md:col-span-2 group">
<span class="text-slate-300 text-sm font-medium flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-[18px]">description</span>
                                Job Description
                            </span>
<div class="relative">
<textarea class="form-textarea w-full rounded-lg bg-[#172236]/50 border border-slate-700/50 text-slate-100 placeholder:text-slate-500 focus:border-primary focus:ring-1 focus:ring-primary focus:bg-[#172236] transition-all duration-300 min-h-[120px] p-4 resize-y" placeholder="Paste the full job description here to improve analysis accuracy..."></textarea>
<div class="absolute bottom-3 right-3">
<button class="text-xs text-primary hover:text-white transition-colors bg-primary/10 px-2 py-1 rounded" type="button">Auto-fill</button>
</div>
</div>
</label>
</div>
<!-- Separator -->
<div class="relative h-px w-full bg-slate-800">
<div class="absolute left-1/2 -translate-x-1/2 -top-2.5 px-3 bg-[#131b2b] text-slate-500 text-sm">
                            AND
                        </div>
</div>
<!-- Upload Zone -->
<div class="group relative z-10">
<label class="cursor-pointer relative flex flex-col items-center justify-center w-full h-48 rounded-xl neon-border-dashed bg-[#172236]/30 hover:bg-[#172236]/60 transition-all duration-300 group-hover:scale-[1.01]">
<div class="flex flex-col items-center justify-center pt-5 pb-6 text-center px-4">
<div class="mb-4 p-3 rounded-full bg-primary/10 text-primary group-hover:bg-primary group-hover:text-white transition-all duration-300 shadow-[0_0_15px_rgba(77,139,255,0.3)]">
<span class="material-symbols-outlined text-3xl">cloud_upload</span>
</div>
<p class="mb-2 text-sm text-slate-300 font-medium">
<span class="text-primary font-bold hover:underline">Click to upload</span> or drag and drop
                                </p>
<p class="text-xs text-slate-500">PDF, DOCX, or TXT (MAX. 10MB)</p>
</div>
<input class="hidden" id="dropzone-file" type="file"/>
<!-- Scanning Animation Bar (Simulated) -->
<div class="absolute bottom-0 left-0 h-1 bg-gradient-to-r from-transparent via-primary to-transparent w-full opacity-0 group-hover:opacity-100 transition-opacity duration-700 animate-[shimmer_2s_infinite]"></div>
</label>
</div>
<!-- Action Button -->
<div class="flex justify-end pt-2 z-10">
<button class="relative overflow-hidden group w-full md:w-auto bg-primary hover:bg-blue-600 text-white font-bold py-3 px-8 rounded-lg shadow-[0_0_20px_rgba(77,139,255,0.4)] hover:shadow-[0_0_30px_rgba(77,139,255,0.6)] transition-all duration-300 flex items-center justify-center gap-2">
<span class="absolute top-0 left-0 w-full h-full bg-gradient-to-r from-transparent via-white/20 to-transparent -translate-x-full group-hover:animate-[shimmer_1.5s_infinite]"></span>
<span class="material-symbols-outlined">auto_awesome</span>
<span>Analyze Resume</span>
</button>
</div>
</div>
<!-- Footer Links -->
<div class="flex justify-center gap-6 text-slate-500 text-sm">
<a class="hover:text-primary transition-colors" href="#">Privacy Policy</a>
<span class="w-1 h-1 rounded-full bg-slate-700 my-auto"></span>
<a class="hover:text-primary transition-colors" href="#">Help Center</a>
</div>
</div>
</main>
</div>
</body></html>
